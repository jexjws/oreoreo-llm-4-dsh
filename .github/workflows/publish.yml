name: publish

# 手动触发发布，避免每次 push 都尝试发版
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只构建不发布'
        type: boolean
        default: false

permissions:
  contents: read
  # npm Trusted Publisher（OIDC）必需：换取短期发布凭据
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # 必须与 npm 侧 Trusted Publisher 填写的 Environment name 一致
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      # 故意不设 registry-url：那会写入带占位符 _authToken 的 .npmrc，
      # npm 会把它当真实凭据去做认证并 401，从而绕过 OIDC。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Trusted Publisher 要求 npm CLI ≥ 11.5.1 才支持 OIDC
      - name: 升级 npm
        run: npm install -g npm@latest

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm run typecheck

      - name: 构建
        run: pnpm run build

      - name: 确认产物已更新
        run: |
          if ! git diff --quiet -- lib; then
            echo "::error::lib/ 与 src/ 不一致，请先在本地 pnpm run build 并提交产物"
            git diff --stat -- lib
            exit 1
          fi

      # 用 npm 而非 pnpm 发布：pnpm publish 会把 --no-git-checks 透传给 npm，
      # 新版 npm 不认该参数直接 EUNKNOWNCONFIG；OIDC 也要求走 npm CLI。
      - name: 发布到 npm（OIDC）
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public --provenance

      - name: 构建预览（dry run）
        if: ${{ inputs.dry_run }}
        run: npm publish --access public --provenance --dry-run
